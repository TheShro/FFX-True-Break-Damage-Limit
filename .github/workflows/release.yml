name: release
# Push a tag like v1.0 to build ffx_true_bdl.dll on a clean machine and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build ffx_true_bdl.dll (32-bit)
        shell: cmd
        working-directory: source
        run: |
          cl /nologo /LD /O2 /MT /W3 ffx_true_bdl.c /Fe:ffx_true_bdl.dll || exit /b 1
          dumpbin /headers ffx_true_bdl.dll | findstr /c:"14C machine (x86)" || (echo NOT x86 & exit /b 1)
      - name: Package
        shell: pwsh
        run: |
          $name = "True-Break-Damage-Limit-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "pkg/modules" | Out-Null
          Copy-Item source/ffx_true_bdl.dll, modules/ffx_true_bdl.ini "pkg/modules/"
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
          body: |
            True Break Damage Limit ${{ github.ref_name }}, built by GitHub Actions from this tag.
            Install: copy the contents of `modules` into `<game folder>\modules\` (ffgriever's FF10 Module Loader).
